services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${STUDYBRIDGE_HOST}
      TRUST_PROXY: "1"
    mem_limit: 768m
    expose:
      - "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDYBRIDGE_HOST: ${STUDYBRIDGE_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
